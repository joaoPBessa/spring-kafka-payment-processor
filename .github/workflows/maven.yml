name: CI Build and Test Multi-Module

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  SPRING_CLOUD_VAULT_ENABLED: 'false'
  SPRING_CLOUD_BOOTSTRAP_ENABLED: 'false'
  TZ: 'America/Sao_Paulo'
  LANG: 'pt_BR.UTF-8'
  LC_ALL: 'pt_BR.UTF-8'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Setup Docker (for Testcontainers)
        uses: docker/setup-buildx-action@v3
        
      - name: Compile and Run Unit Tests
        run: mvn -B clean verify -Dsurefire.redirectTestOutputToFile=false

      - name: Package Final Artifacts
        run: mvn -B package -DskipTests