name: CI Build and Test Multi-Module

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: 'UTC'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test (unit + Testcontainers integration)
        env:
          SPRING_CLOUD_VAULT_ENABLED: 'false'
          SPRING_CLOUD_BOOTSTRAP_ENABLED: 'false'
        run: mvn --no-transfer-progress -B clean verify -Dsurefire.redirectTestOutputToFile=false
