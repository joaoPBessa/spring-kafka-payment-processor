services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5@hbQqkGB<
      POSTGRES_DB: payments_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment-network

  redis:
    image: redis:7.2-alpine
    container_name: payment-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment-network

  vault:
      image: hashicorp/vault:1.15
      container_name: payment-vault
      ports:
        - "8200:8200"
      environment:
        VAULT_DEV_ROOT_TOKEN_ID: "root-token-local"
        VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      cap_add:
        - IPC_LOCK
      healthcheck:
        test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8200/v1/sys/health"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - payment-network

  vault-init:
   image: hashicorp/vault:1.15
   container_name: payment-vault-init
   volumes:
    - ./scripts/init-vault.sh:/tmp/init-vault.sh
   entrypoint: ["sh", "/tmp/init-vault.sh"]
   depends_on:
    vault:
     condition: service_healthy
   networks:
    - payment-network

volumes:
  postgres_data:
  redis_data:

networks:
  payment-network:
    driver: bridge