spring:
  cloud:
    vault:
      enabled: false
  flyway:
    enabled: true
    schemas: payment
    locations: classpath:db/migration

app:
  dlt-replay:
    enabled: false
  kafka:
    retry:
      max-attempts: 3
      initial-interval: 50ms
      multiplier: 1.5
      max-interval: 200ms

management:
  health:
    vault:
      enabled: false
  tracing:
    export:
      zipkin:
        enabled: false
